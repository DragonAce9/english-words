{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: english-words
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.DATABASE_URL | quote }}
  BOT_TOKEN: {{ .Values.secret.BOT_TOKEN | quote }}
  TRIBUTE_API_KEY: {{ .Values.secret.TRIBUTE_API_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.secret.GEMINI_API_KEY | quote }}
{{- end }}
