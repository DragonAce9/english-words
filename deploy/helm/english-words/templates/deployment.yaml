apiVersion: apps/v1
kind: Deployment
metadata:
  name: english-words
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: english-words
  template:
    metadata:
      labels:
        app: english-words
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: english-words
                  key: DATABASE_URL
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: english-words
                  key: BOT_TOKEN
            - name: TRIBUTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: english-words
                  key: TRIBUTE_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: english-words
                  key: GEMINI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
