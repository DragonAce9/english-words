services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: english
      POSTGRES_PASSWORD: english
      POSTGRES_DB: english
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://eu.i.posthog.com}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://english:english@postgres:5432/english
      BOT_TOKEN: ${BOT_TOKEN:-123456:replace-me}
      BOT_USERNAME: ${BOT_USERNAME:-YOUR_BOT_USERNAME}
      SUPPORT_TELEGRAM_USER_ID: ${SUPPORT_TELEGRAM_USER_ID:-}
      SUPPORT_TELEGRAM_USERNAME: ${SUPPORT_TELEGRAM_USERNAME:-YOUR_SUPPORT_USERNAME}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000}
      TRIBUTE_API_KEY: ${TRIBUTE_API_KEY:-dev-tribute-key}
      TRIBUTE_PRODUCT_MONTHLY_ID: ${TRIBUTE_PRODUCT_MONTHLY_ID:-1001}
      TRIBUTE_PRODUCT_YEARLY_ID: ${TRIBUTE_PRODUCT_YEARLY_ID:-1002}
      TRIBUTE_SUBSCRIBE_URL: ${TRIBUTE_SUBSCRIBE_URL:-https://web.tribute.tg/p/YOUR_MONTHLY_PRODUCT}
      TRIBUTE_SUBSCRIBE_YEARLY_URL: ${TRIBUTE_SUBSCRIBE_YEARLY_URL:-https://web.tribute.tg/p/YOUR_YEARLY_PRODUCT}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      WORDTRON_TESTER_IDS: ${WORDTRON_TESTER_IDS:-}
      DEV_TELEGRAM_USER_ID: ${DEV_TELEGRAM_USER_ID:-1}
      DICTIONARY_DIR: /app/data/themes
      MIGRATIONS_DIR: /app/migrations
      WEB_DIST: /app/packages/web/dist
      PET_SUFFER_HOURS: ${PET_SUFFER_HOURS:-72}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      FACT_CHANNEL_ID: ${FACT_CHANNEL_ID:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES:-en,fr,de,es,it,pt,fi,sl,hr,sr}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One service, two modes (compose interpolation — the image is distroless, no shell):
  #   Named / stable (Cloudflare account + zone): set TUNNEL_TOKEN and
  #     CLOUDFLARED_CMD=tunnel --no-autoupdate run
  #     Public Hostname in the dashboard → service http://api:3000 (this compose name).
  #     WEBAPP_URL=https://<that-hostname>  then: docker compose up -d
  #   Quick fallback (no token): trycloudflare.com — URL is in this service's logs
  #     and changes every restart. Copy it into WEBAPP_URL, then: docker compose up -d api
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: ${CLOUDFLARED_CMD:-tunnel --no-autoupdate --url http://api:3000}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - api

volumes:
  pgdata:
